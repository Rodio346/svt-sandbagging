# Study plan + price sheet. PRICES CHANGE: check each provider's pricing page before running.
# Prices are USD per 1M tokens (input, output). Model IDs are Inspect model strings.
usd_to_gbp: 0.75          # approximate; update
dataset: wmdp
n_items: 300
n_perms: 2
tokens:                   # averages per call, re-estimate from the pilot (scripts/estimate_cost.py --from-logs)
  input: 400
  output_subject: 400     # scratchpad + low-effort hidden reasoning
  output_weak: 250
  monitor_input: 700
  monitor_output: 120

# Model ids are PINNED to the version each provider actually served (read from the
# resolved model name in every sample's API response, 2026-10-22/23). Never use a
# moving alias here: record the resolution under `aliases` instead.
subjects:                 # capable models that get every arm
  - {id: google/gemini-3.8-flash,        price: [0.50, 3.00]}  # "Gemini 3.8 Flash"
  - {id: openai/gpt-5-mini-2025-08-07,   price: [0.25, 2.00]}  # dated snapshot; price approximate, verify
  - {id: deepseek/deepseek-flash,        price: [0.27, 1.10]}  # "DeepSeek-V4.1-Flash" (direct API, DEEPSEEK_API_KEY);
                                                                # NOT DeepSeek-V3 - the API serves no dated snapshot

weak_controls:            # honest arm only; also in the item-difficulty reference (D3, D6)
  - {id: google/gemini-3.5-flash-lite,   price: [0.10, 0.40]}  # gemini-2.5-flash-lite retired for new users 2026-10
  - {id: openai/gpt-5-nano-2025-08-07,   price: [0.05, 0.40]}
  # Added 2026-10-25: weak models near X = 0.5 on WMDP, so the X = 0.5 arms get an
  # accuracy-matched cross-model control (stem redaction cannot reach 0.5 for two subjects).
  # gpt-3.5-turbo and gpt-4.1-nano were tried first but are retired (404 deprecated).
  - {id: openai/gpt-4o-mini-2024-07-18,  price: [0.15, 0.60]}  # 60-item probe: 0.68
  # Local models (Ollama, free). Pinned by content digest: llama3.1:8b = 46e0c10c039e (Q4_K_M, 4.9 GB),
  # llama3.2:3b = a80c4f17acd5 (2.0 GB). Llama 3 has no reasoning mode and Ollama rejects a
  # reasoning_effort for it ("does not support thinking"), so it is sent none.
  - {id: ollama/llama3.1:8b,             price: [0.0, 0.0], reasoning_effort: null}
  - {id: ollama/llama3.2:3b,             price: [0.0, 0.0], reasoning_effort: null}

# Independent difficulty panel (added 2026-10-26): honest runs ONLY to define the floor set -
# the items all three answer correctly in both option orders. They are never compared with
# anything, so no compared run helps define its own floor. Local Ollama models (free), 4-bit,
# 3-4B parameters to fit a 4 GB GPU (llama3.1:8b did not fit and ran ~19 s/answer on CPU).
# No reasoning mode. Stored on D: (OLLAMA_MODELS=D:/ollama/models), pinned by digest:
# qwen2.5:3b = 357c53fb659c (3.1B, Q4_K_M), gemma3:4b = 68ceab7e468a (3.9B, Q4_K_M),
# phi3.5:3.8b = 61819fb370a3 (3.8B, Q4_0 - the only tag Ollama ships). phi3.5 sometimes loops
# without stopping (Ollama 10-min timeouts); it is capped at 2048 tokens (median answer ~130),
# so a loop ends as a parse failure. Its uncapped partial run is in difficulty_panel_rejected.
# phi4-mini (78fad5d182a7, 3.8B) was run first and REJECTED: 19% parse failures (mostly the
# ANSWER line written inside the scratchpad); its log is kept in logs/difficulty_panel_rejected.
# qwen3:4b was probed and rejected: its thinking mode ran ~10 min/answer on this GPU.
difficulty_panel:
  - {id: ollama/qwen2.5:3b,              price: [0.0, 0.0], reasoning_effort: null}
  - {id: ollama/gemma3:4b,               price: [0.0, 0.0], reasoning_effort: null}
  - {id: ollama/phi3.5:3.8b,             price: [0.0, 0.0], reasoning_effort: null, max_tokens: 2048}

# Alias each earlier run was REQUESTED under -> the pinned id it resolved to. load_logs maps
# requested ids through this table, so runs logged under an alias count as the pinned model,
# and it records the per-sample resolved version so any drift is visible (results/models.json).
aliases:
  google/gemini-flash-latest: google/gemini-3.8-flash          # all 5,560 samples resolved to gemini-3.8-flash
  openai/gpt-5-mini:          openai/gpt-5-mini-2025-08-07     # gpt-5-mini-2025-08-07
  openai/gpt-5-nano:          openai/gpt-5-nano-2025-08-07     # gpt-5-nano-2025-08-07
  deepseek/deepseek-chat:     deepseek/deepseek-flash          # legacy alias; served as deepseek-flash

calibration_reference: google/gemini-3.5-flash-lite   # X = this model's honest accuracy
stemless_items: 100       # options-only accuracy is measured on this many items per subject
seed: 0

frontier_spotcheck:       # optional: fewer items and arms
  id: anthropic/claude-sonnet-5-5   # verify the exact API id
  price: [2.00, 10.00]
  n_items: 150
  arms: [honest, naive, calibrated, incentive]

monitor:
  id: google/gemini-3.5-flash-lite
  price: [0.10, 0.40]

# full-size subject arms (stemless is extra, at stemless_items); honest_rep1 is the run-to-run null
arms: [honest, honest_rep1, naive, calibrated, coached, incentive, incentive_reverse, redacted]

pilot:                    # arithmetic, to measure real token use and compliance
  dataset: arith
  n_items: 40
  models: 2
