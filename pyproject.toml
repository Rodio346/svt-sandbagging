[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svt-sandbag"
version = "0.1.0"
description = "Symptom-validity (malingering) tests for LLM sandbagging, built on Inspect"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai>=0.3.150",
  "datasets>=2.19",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
providers = ["openai", "google-genai", "anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
